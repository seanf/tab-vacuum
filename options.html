<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Tab Vacuum — Options</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(180deg, #0f0f1e 0%, #1a1a2e 100%);
    color: #fff;
    padding: 20px;
    min-width: 380px;
    margin: 0;
  }
  h1 { font-size: 16px; margin: 0 0 4px; font-weight: 700; }
  .sub { color: #b4b4c7; font-size: 12px; margin-bottom: 20px; }
  .row {
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
    padding: 14px 16px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
  }
  .row label { flex: 1; cursor: pointer; user-select: none; }
  .row label .title { font-size: 14px; font-weight: 600; }
  .row label .desc { font-size: 12px; color: #b4b4c7; margin-top: 4px; line-height: 1.5; }
  .switch { position: relative; width: 42px; height: 24px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; cursor: pointer; inset: 0;
    background: rgba(255,255,255,0.15);
    border-radius: 24px;
    transition: 0.2s;
  }
  .slider::before {
    content: ""; position: absolute;
    height: 18px; width: 18px;
    left: 3px; top: 3px;
    background: #fff;
    border-radius: 50%;
    transition: 0.2s;
  }
  input:checked + .slider { background: linear-gradient(135deg, #6366f1, #8b5cf6); }
  input:checked + .slider::before { transform: translateX(18px); }
  .footer {
    margin-top: 16px; font-size: 11px; color: #b4b4c7;
    text-align: center; line-height: 1.6;
  }
  .footer a { color: #8b5cf6; text-decoration: none; }
</style>
</head>
<body>
  <h1>Tab Vacuum</h1>
  <div class="sub">One optional preference. Saved automatically. Defaults give you the magic 1-click experience.</div>

  <div class="row">
    <label for="currentWindowOnly">
      <div class="title">Current window only</div>
      <div class="desc">Dedupe and group only the window you click in. Other windows are left untouched. Default: act on every open window.</div>
    </label>
    <div class="switch">
      <input type="checkbox" id="currentWindowOnly" />
      <span class="slider"></span>
    </div>
  </div>

  <div class="footer">
    Stored locally on this device. Nothing syncs anywhere.<br />
    <a href="https://github.com/mayhsundar/tab-vacuum" target="_blank" rel="noopener">View source on GitHub</a>
  </div>

  <script src="options.js"></script>
</body>
</html>
